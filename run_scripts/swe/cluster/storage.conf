# Rootful Podman storage for disposable SWE benchmark containers.
# Keep graphroot on a large node-local disk; do not point it at shared NAS.

[storage]
driver = "overlay"
graphroot = "/podman_data/storage"
runroot = "/run/containers/storage"
transient_store = true

[storage.options]

[storage.options.overlay]
mountopt = "nodev,metacopy=on,noatime"
